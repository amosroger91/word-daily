# Apache vhost for https://word.wellspringstudiollc.com (TLS added by certbot).
<VirtualHost *:80>
    ServerName word.wellspringstudiollc.com

    ProxyPreserveHost On
    ProxyTimeout 300
    ProxyPass / http://127.0.0.1:4319/
    ProxyPassReverse / http://127.0.0.1:4319/

    # Same studio login as Finds Studio.
    <Location />
        AuthType Basic
        AuthName "Daily Verse Studio"
        AuthUserFile /opt/finds-studio/.htpasswd
        Require valid-user
    </Location>
    # Homepage, privacy policy and terms stay public.
    <Location /site/>
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/word-daily-error.log
    CustomLog ${APACHE_LOG_DIR}/word-daily-access.log combined
</VirtualHost>
